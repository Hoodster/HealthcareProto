name: Trigger auto deployment for singleton-hpproto-containerapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/singleton-hpproto-containerapp-AutoDeployTrigger-f939a701-455b-4418-9ae9-856cb745bdda.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SINGLETONHPPROTOCONTAINERAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SINGLETONHPPROTOCONTAINERAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SINGLETONHPPROTOCONTAINERAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.SINGLETONHPPROTOCONTAINERAPP_ACR_NAME }} \
            --image singleton-hpproto-containerapp:${{ github.sha }} \
            --image singleton-hpproto-containerapp:latest \
            --file Dockerfile .

      - name: Deploy to App Service
        run: |
          az webapp config container set \
            --name azaphtn4tglr3jlgw \
            --resource-group finalproject \
            --docker-custom-image-name ${{ secrets.SINGLETONHPPROTOCONTAINERAPP_ACR_NAME }}.azurecr.io/singleton-hpproto-containerapp:${{ github.sha }} \
            --docker-registry-server-url https://${{ secrets.SINGLETONHPPROTOCONTAINERAPP_ACR_NAME }}.azurecr.io \
            --docker-registry-server-username ${{ secrets.SINGLETONHPPROTOCONTAINERAPP_ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.SINGLETONHPPROTOCONTAINERAPP_ACR_PASSWORD }}


